// Equivalent build configuration for the pinned jsoup translation test, without
// its integrationTest task. Groovy avoids Kotlin DSL's accessors-report task.
plugins {
    id 'java-library'
}

group = 'org.jsoup'
version = '1.23.2'
description = 'jsoup Java HTML Parser'

repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

dependencies {
    compileOnly 'org.jspecify:jspecify:1.0.1'
    compileOnly 'com.google.re2j:re2j:1.8'
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.14.0'
    testImplementation platform('io.netty:netty-bom:4.2.17.Final')
    testImplementation 'io.netty:netty-codec-http'
    testImplementation 'io.netty:netty-handler'
    testImplementation 'org.jspecify:jspecify:1.0.1'
    testImplementation 'com.google.re2j:re2j:1.8'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-Xlint:none')
}
tasks.compileJava {
    options.compilerArgs.add('-Xpkginfo:always')
    options.compilerArgs.addAll(['--add-reads', 'org.jsoup=ALL-UNNAMED'])
}
tasks.processResources { from('LICENSE') { into('META-INF/jsoup') } }
tasks.jar {
    exclude 'org/jsoup/examples/**'
    manifest {
        attributes 'Implementation-Title': project.description,
            'Implementation-Version': project.version, 'Main-Class': 'org.jsoup.cli.Main'
    }
}
tasks.test {
    useJUnitPlatform()
    jvmArgs '-Xss640k'
    exclude '**/IT*.class', '**/*IT.class', '**/*ITCase.class'
}
